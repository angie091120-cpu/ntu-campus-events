<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>活動行事曆 · 校園活動</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #F5F1E8;
      --surface: #FFFFFF;
      --text: #1A1815;
      --text-muted: #6B665C;
      --text-faint: #B5AE9E;
      --border: #DED8C5;
      --border-soft: #EBE6D8;
      --accent: #2C5530;

      --c-lecture: #2E5BBA;
      --c-workshop: #D97342;
      --c-club: #7B4FB8;
      --c-performance: #C73E7E;
      --c-sports: #4A7C3A;
      --c-competition: #B82E2E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ───── Header（跟其他頁面一致） ───── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .brand {
      font-family: 'Noto Serif TC', serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 0.04em;
      display: flex; align-items: baseline; gap: 6px;
    }
    .brand .accent {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      transform: translateY(-3px);
    }
    .brand .sub {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 12px; font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.1em; margin-left: 4px;
    }
    nav { display: flex; gap: 28px; }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px; font-weight: 500;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    nav a.active { color: var(--text); border-bottom-color: var(--accent); }
    nav a:hover { color: var(--text); }

    /* ───── Main ───── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 36px 60px;
    }

    /* ───── 月份切換 bar ───── */
    .month-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .month-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .nav-arrows { display: flex; gap: 6px; }
    .nav-arrows button {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      font-family: inherit;
    }
    .nav-arrows button:hover { background: var(--bg); }
    .today-btn {
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.15s;
    }
    .today-btn:hover { background: var(--bg); }

    .month-meta {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ───── 類型篩選 chips（跟列表頁同款） ───── */
    .type-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.15s;
      user-select: none;
    }
    .chip:hover { border-color: var(--text-muted); }
    .chip.active {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }
    .chip .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .chip .count {
      font-size: 11px;
      opacity: 0.6;
      font-variant-numeric: tabular-nums;
    }

    /* ───── 月曆主體 ───── */
    .calendar {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
    }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--bg);
      border-bottom: 1px solid var(--border-soft);
    }
    .weekday-row > div {
      padding: 12px 10px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.12em;
    }
    .weekday-row .sunday   { color: var(--c-performance); }
    .weekday-row .saturday { color: var(--c-lecture); }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(110px, 1fr);
    }

    .day-cell {
      border-right: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 110px;
      position: relative;
      transition: background 0.15s;
    }
    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell:nth-last-child(-n+7) { border-bottom: none; }
    .day-cell.other-month { background: #FAF8F1; }
    .day-cell.other-month .day-number { color: var(--text-faint); }
    .day-cell:hover { background: var(--bg); }

    .day-number {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin-bottom: 2px;
    }
    .day-cell.today .day-number {
      background: var(--accent);
      color: white;
    }
    .day-cell.sunday   .day-number { color: var(--c-performance); }
    .day-cell.saturday .day-number { color: var(--c-lecture); }
    .day-cell.today.sunday .day-number,
    .day-cell.today.saturday .day-number { color: white; }

    /* 每個活動的「藥丸」樣式 */
    .event-pill {
      font-size: 11px;
      line-height: 1.35;
      padding: 3px 8px;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: opacity 0.15s;
      font-weight: 500;
    }
    .event-pill:hover { opacity: 0.85; }
    .event-pill.lecture     { background: var(--c-lecture); }
    .event-pill.workshop    { background: var(--c-workshop); }
    .event-pill.club        { background: var(--c-club); }
    .event-pill.performance { background: var(--c-performance); }
    .event-pill.sports      { background: var(--c-sports); }
    .event-pill.competition { background: var(--c-competition); }

    .more-link {
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .more-link:hover { background: var(--border-soft); color: var(--text); }

    /* ───── Modal ───── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-backdrop.show {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 28px;
      max-width: 460px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal .close {
      position: absolute;
      top: 16px; right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
      padding: 6px 10px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .modal .close:hover { background: var(--bg); }

    .modal .type-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      color: white;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .modal .type-tag.lecture     { background: var(--c-lecture); }
    .modal .type-tag.workshop    { background: var(--c-workshop); }
    .modal .type-tag.club        { background: var(--c-club); }
    .modal .type-tag.performance { background: var(--c-performance); }
    .modal .type-tag.sports      { background: var(--c-sports); }
    .modal .type-tag.competition { background: var(--c-competition); }

    .modal h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 22px;
      line-height: 1.4;
      margin-bottom: 16px;
      padding-right: 28px;
    }
    .modal .meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 0;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 16px;
      font-size: 13px;
    }
    .modal .meta .row {
      display: flex;
      gap: 10px;
      color: var(--text);
    }
    .modal .meta .row .label {
      color: var(--text-muted);
      min-width: 40px;
      letter-spacing: 0.05em;
    }
    .modal .desc {
      font-size: 13px;
      line-height: 1.75;
      margin-bottom: 20px;
      color: var(--text);
    }
    .modal .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .modal .actions a {
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
      letter-spacing: 0.04em;
    }
    .modal .actions .primary {
      background: var(--text);
      color: white;
      flex: 1;
      text-align: center;
    }
    .modal .actions .primary:hover { background: var(--accent); }
    .modal .actions .secondary {
      border: 1px solid var(--border);
      color: var(--text);
    }
    .modal .actions .secondary:hover { background: var(--bg); }
    .modal .actions .reg-badge {
      display: inline-block;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 6px;
      background: rgba(217, 115, 66, 0.12);
      color: #B85A2B;
      font-weight: 500;
    }
    .modal .actions .reg-badge.free {
      background: rgba(74, 124, 58, 0.12);
      color: var(--accent);
    }
    .deadline-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      font-size: 11px;
      border-radius: 999px;
      font-weight: 500;
      vertical-align: middle;
    }
    .deadline-badge::before { content: "⏱"; font-size: 11px; }
    .deadline-badge.open { background: rgba(46, 91, 186, 0.1); color: var(--c-lecture); }
    .deadline-badge.urgent { background: rgba(217, 115, 66, 0.15); color: #B85A2B; }
    .deadline-badge.today {
      background: rgba(184, 46, 46, 0.12);
      color: var(--c-competition);
      font-weight: 700;
    }
    .deadline-badge.today::before { content: "🔥"; }
    .deadline-badge.closed {
      background: var(--bg);
      color: var(--text-faint);
      text-decoration: line-through;
    }
    .offsite-tag {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 7px;
      font-size: 10px;
      border-radius: 999px;
      background: rgba(217, 115, 66, 0.15);
      color: #B85A2B;
      vertical-align: middle;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    /* ───── Empty state ───── */
    .empty {
      padding: 80px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty .big {
      font-family: 'Noto Serif TC', serif;
      font-size: 24px;
      color: var(--text);
      margin-bottom: 8px;
    }

    /* ───── Mobile ───── */
    @media (max-width: 720px) {
      main { padding: 24px 16px 60px; }
      .month-title { font-size: 24px; }
      .month-bar { flex-wrap: wrap; gap: 12px; }
      .calendar-grid { grid-auto-rows: minmax(72px, 1fr); }
      .day-cell { padding: 4px; min-height: 72px; }
      .weekday-row > div { padding: 8px 4px; font-size: 11px; }
      .event-pill {
        font-size: 0;
        padding: 0;
        height: 6px;
        width: 100%;
        border-radius: 2px;
      }
      .day-cell { gap: 2px; }
      .more-link { font-size: 10px; padding: 1px 4px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      校園活動
      <span class="accent"></span>
      地圖
      <span class="sub">NTU CAMPUS EVENTS</span>
    </div>
    <nav>
      <a href="home.html">首頁</a>
      <a href="index.html">地圖</a>
      <a href="events.html">活動列表</a>
      <a href="calendar.html" class="active">行事曆</a>
    </nav>
  </header>

  <!-- demo-notice 2026-09-30：課程專題原型的示範資料提示 -->
  <div class="demo-notice" role="note" style="background:#EFEADE;color:#6B665C;font-size:12px;line-height:18px;padding:6px 16px;text-align:center;border-bottom:1px solid #EBE6D8;">示範資料｜本站是課程專題原型，活動與主辦資訊皆為虛構。</div>

  <main>
    <div class="month-bar">
      <h1 class="month-title" id="monthTitle">2026 年 5 月</h1>
      <div class="nav-arrows">
        <button id="prevBtn" aria-label="上個月">‹</button>
        <button id="nextBtn" aria-label="下個月">›</button>
      </div>
      <button class="today-btn" id="todayBtn">今天</button>
      <span class="month-meta" id="monthMeta">本月共 0 場活動</span>
    </div>

    <div class="type-chips" id="typeChips"></div>

    <div class="calendar">
      <div class="weekday-row">
        <div class="sunday">日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div class="saturday">六</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <button class="close" onclick="closeModal()" aria-label="關閉">×</button>
      <span class="type-tag" id="modalType"></span>
      <h2 id="modalTitle"></h2>
      <div class="meta" id="modalMeta"></div>
      <p class="desc" id="modalDesc"></p>
      <div class="actions" id="modalActions"></div>
    </div>
  </div>

  <script src="events.js"></script>
  <script src="tracking.js"></script>
  <script>
    /* ════════════════════════════════════════════════
       狀態
       ════════════════════════════════════════════════ */
    const state = {
      year: new Date().getFullYear(),
      month: new Date().getMonth(), // 0-11
      activeTypes: new Set(),
    };

    /* ════════════════════════════════════════════════
       工具
       ════════════════════════════════════════════════ */
    // 格式化 YYYY-MM-DD（本地時區，避免 UTC 偏移）
    function formatDateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear()
          && a.getMonth() === b.getMonth()
          && a.getDate() === b.getDate();
    }

    /* ════════════════════════════════════════════════
       篩選器
       ════════════════════════════════════════════════ */
    function renderChips() {
      const counts = {};
      EVENTS.forEach(e => { counts[e.type] = (counts[e.type] || 0) + 1; });
      const allSelected = state.activeTypes.size === EVENT_TYPES.length;

      const container = document.getElementById('typeChips');
      const allChip = `
        <div class="chip ${allSelected ? 'active' : ''}" data-type="__all">
          全部 <span class="count">${EVENTS.length}</span>
        </div>`;
      const others = EVENT_TYPES.map(t => `
        <div class="chip ${!allSelected && state.activeTypes.has(t.id) ? 'active' : ''}" data-type="${t.id}">
          <span class="dot" style="background:${t.color}"></span>
          ${t.name} <span class="count">${counts[t.id] || 0}</span>
        </div>
      `).join('');
      container.innerHTML = allChip + others;

      container.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const type = chip.dataset.type;
          if (type === '__all') {
            state.activeTypes = new Set(EVENT_TYPES.map(t => t.id));
          } else if (state.activeTypes.size === 1 && state.activeTypes.has(type)) {
            state.activeTypes = new Set(EVENT_TYPES.map(t => t.id));
          } else {
            state.activeTypes = new Set([type]);
          }
          renderChips();
          renderCalendar();
        });
      });
    }

    /* ════════════════════════════════════════════════
       月曆主體
       ════════════════════════════════════════════════ */
    const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    function renderCalendar() {
      const { year, month } = state;
      const today = new Date();

      // 標題
      document.getElementById('monthTitle').textContent =
        `${year} 年 ${MONTH_NAMES[month]}`;

      // 該月活動數
      const filtered = EVENTS.filter(e => state.activeTypes.has(e.type));
      const monthEvents = filtered.filter(e => {
        const d = new Date(e.date);
        return d.getFullYear() === year && d.getMonth() === month;
      });
      document.getElementById('monthMeta').textContent = `本月共 ${monthEvents.length} 場活動`;

      // 把活動依日期分組
      const eventsByDate = {};
      filtered.forEach(e => {
        if (!e.date) return;
        if (!eventsByDate[e.date]) eventsByDate[e.date] = [];
        eventsByDate[e.date].push(e);
      });

      // 建月曆格子
      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay(); // 0=Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      const cells = [];

      // 上月填充
      for (let i = startWeekday - 1; i >= 0; i--) {
        const d = new Date(year, month - 1, daysInPrevMonth - i);
        cells.push({ date: d, isOtherMonth: true });
      }
      // 本月
      for (let i = 1; i <= daysInMonth; i++) {
        cells.push({ date: new Date(year, month, i), isOtherMonth: false });
      }
      // 下月填充至 42 格（6 行）
      while (cells.length < 42) {
        const d = new Date(year, month + 1, cells.length - daysInMonth - startWeekday + 1);
        cells.push({ date: d, isOtherMonth: true });
      }

      // 渲染
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = cells.map(cell => {
        const d = cell.date;
        const key = formatDateKey(d);
        const events = eventsByDate[key] || [];
        const dow = d.getDay();

        let cls = 'day-cell';
        if (cell.isOtherMonth) cls += ' other-month';
        if (isSameDay(d, today)) cls += ' today';
        if (dow === 0) cls += ' sunday';
        if (dow === 6) cls += ' saturday';

        // 每格最多顯示 2 個活動，多的折成 +N 個
        const MAX_VISIBLE = 2;
        const visible = events.slice(0, MAX_VISIBLE);
        const hidden = events.length - visible.length;

        const eventsHtml = visible.map(e => `
          <div class="event-pill ${e.type}" data-id="${e.id}" title="${escapeAttr(e.title)}">
            ${escapeHtml(e.title)}
          </div>
        `).join('');

        const moreHtml = hidden > 0
          ? `<div class="more-link" data-date="${key}">＋${hidden} 個</div>`
          : '';

        return `
          <div class="${cls}">
            <div class="day-number">${d.getDate()}</div>
            ${eventsHtml}
            ${moreHtml}
          </div>
        `;
      }).join('');

      // 綁定點擊
      grid.querySelectorAll('.event-pill').forEach(el => {
        el.addEventListener('click', () => openModal(el.dataset.id));
      });
      grid.querySelectorAll('.more-link').forEach(el => {
        el.addEventListener('click', () => showDayEvents(el.dataset.date));
      });
    }

    /* ════════════════════════════════════════════════
       Modal
       ════════════════════════════════════════════════ */
    function openModal(id) {
      const event = EVENTS.find(e => e.id === id);
      if (!event) return;
      const type = EVENT_TYPES.find(t => t.id === event.type);

      const typeEl = document.getElementById('modalType');
      typeEl.className = `type-tag ${event.type}`;
      typeEl.textContent = type ? type.name : event.type;

      document.getElementById('modalTitle').textContent = event.title;

      const offsiteTag = event.mapLocation ? '' : ' <span class="offsite-tag">校外/其他</span>';
      const metaRows = [
        `<div class="row"><span class="label">時間</span><span>${event.date} · ${event.time || ''}</span></div>`,
        `<div class="row"><span class="label">地點</span><span>${escapeHtml(event.location || '地點未提供')}${offsiteTag}</span></div>`,
      ];
      if (event.organizer) {
        metaRows.push(`<div class="row"><span class="label">主辦</span><span>${escapeHtml(event.organizer)}</span></div>`);
      }
      // 報名截止
      const regStatus = getRegistrationStatus(event);
      if (regStatus) {
        metaRows.push(`<div class="row"><span class="label">報名</span><span><span class="deadline-badge ${regStatus.status}">${regStatus.label}</span></span></div>`);
      }
      document.getElementById('modalMeta').innerHTML = metaRows.join('');
      document.getElementById('modalDesc').textContent = event.description || '';

      // 動態 actions
      const buttons = [];
      if (event.needsRegistration && event.registrationLink) {
        if (regStatus && regStatus.status === 'closed') {
          buttons.push(`<span class="primary" style="opacity:0.5;cursor:not-allowed;flex:1;text-align:center">報名已截止</span>`);
        } else {
          buttons.push(`<a href="${trackUrl(event.id, event.registrationLink)}" class="primary" target="_blank" rel="noopener">立即報名 →</a>`);
        }
        if (event.link) buttons.push(`<a href="${trackUrl(event.id, event.link)}" class="secondary" target="_blank" rel="noopener">詳情</a>`);
      } else if (event.needsRegistration === true) {
        buttons.push(`<span class="reg-badge">⚠ 需報名</span>`);
        if (event.link) buttons.push(`<a href="${trackUrl(event.id, event.link)}" class="primary" target="_blank" rel="noopener">查看活動 →</a>`);
      } else {
        if (event.link) buttons.push(`<a href="${trackUrl(event.id, event.link)}" class="primary" target="_blank" rel="noopener">查看活動 →</a>`);
        if (event.needsRegistration === false) buttons.push(`<span class="reg-badge free">自由參加</span>`);
      }
      // 校外活動不顯示「在地圖上查看」（沒意義）
      if (event.mapLocation) {
        buttons.push(`<a href="index.html#${event.id}" class="secondary">在地圖上查看</a>`);
      }
      document.getElementById('modalActions').innerHTML = buttons.join('');

      document.getElementById('modal').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }
    // 點背景關閉
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });
    // ESC 關閉
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    /* 點「+N 個」展開該日所有活動 */
    function showDayEvents(dateKey) {
      const dayEvents = EVENTS
        .filter(e => state.activeTypes.has(e.type) && e.date === dateKey);
      if (dayEvents.length === 0) return;
      if (dayEvents.length === 1) {
        openModal(dayEvents[0].id);
        return;
      }
      // 多個活動：選清單，這裡簡化為依序顯示，先顯示第一個
      // （未來可以做更完整的「當日清單」視圖）
      openModal(dayEvents[0].id);
    }

    /* ════════════════════════════════════════════════
       月份切換
       ════════════════════════════════════════════════ */
    document.getElementById('prevBtn').addEventListener('click', () => {
      state.month--;
      if (state.month < 0) { state.month = 11; state.year--; }
      renderCalendar();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      state.month++;
      if (state.month > 11) { state.month = 0; state.year++; }
      renderCalendar();
    });
    document.getElementById('todayBtn').addEventListener('click', () => {
      const now = new Date();
      state.year = now.getFullYear();
      state.month = now.getMonth();
      renderCalendar();
    });

    /* 工具 */
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    /* 啟動 */
    loadEvents().then(() => {
      state.activeTypes = new Set(EVENT_TYPES.map(t => t.id));
      renderChips();
      renderCalendar();
    });
  </script>
  <!-- Vercel Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
