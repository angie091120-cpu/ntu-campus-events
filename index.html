<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>校園活動地圖 · 臺大</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #F5F1E8;
      --surface: #FFFFFF;
      --text: #1A1815;
      --text-muted: #6B665C;
      --border: #DED8C5;
      --border-soft: #EBE6D8;
      --accent: #2C5530;

      /* 每種活動類型一個顏色 */
      --c-lecture: #2E5BBA;
      --c-workshop: #D97342;
      --c-club: #7B4FB8;
      --c-performance: #C73E7E;
      --c-sports: #4A7C3A;
      --c-competition: #B82E2E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Noto Sans TC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ───── Header ───── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      font-family: 'Noto Serif TC', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .brand .accent {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      transform: translateY(-3px);
    }
    .brand .sub {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      margin-left: 4px;
    }

    nav { display: flex; gap: 28px; }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    nav a.active { color: var(--text); border-bottom-color: var(--accent); }
    nav a:hover { color: var(--text); }

    /* ───── Main grid ───── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 0;
    }

    /* ───── Sidebar ───── */
    aside.sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border-soft);
      padding: 28px 24px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-family: 'Noto Serif TC', serif;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 0.12em;
      color: var(--text);
      text-transform: uppercase;
    }
    .sidebar h2 + .filter-list { margin-bottom: 28px; }

    .filter-list { display: flex; flex-direction: column; gap: 2px; }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
      font-size: 14px;
      user-select: none;
    }
    .filter-item:hover { background: var(--bg); }
    .filter-item input {
      width: 15px; height: 15px;
      accent-color: var(--accent);
      cursor: pointer; margin: 0;
    }
    .filter-item .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .filter-item .label-text { flex: 1; }
    .filter-item .count {
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-foot {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* ───── Map area ───── */
    .map-section {
      position: relative;
      background: var(--bg);
      overflow: hidden;
      /* 讓 viewport 撐滿整個區塊 */
      display: flex;
    }

    /* viewport 是 panzoom 看到的「窗口」，永遠固定大小 */
    .map-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: 24px;
      border-radius: 8px;
      background: #e8e4d8;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-viewport:active { cursor: grabbing; }

    /* container 是真正被 panzoom 縮放與移動的層
       注意：不能用 absolute + translate 居中，因為 panzoom 會覆蓋 transform
       改用 viewport 的 flex 居中。container 不設 max-*，
       讓它跟隨 img 的實際尺寸，這樣 marker 用 % 定位才會準確對應到圖片內位置 */
    .map-container {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    .map-container img {
      display: block;
      /* max-width/max-height 由 JS 動態設定，跟 viewport 同尺寸 */
      width: auto;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ───── Zoom controls ───── */
    .zoom-controls {
      position: absolute;
      bottom: 44px;
      right: 44px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      z-index: 25;
    }
    .zoom-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: var(--surface);
      cursor: pointer;
      font-size: 18px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      padding: 0;
      font-family: inherit;
    }
    .zoom-btn:hover { background: var(--bg); }
    .zoom-btn:not(:last-child) { border-bottom: 1px solid var(--border-soft); }
    .zoom-btn.reset { font-size: 14px; }

    .zoom-level {
      position: absolute;
      bottom: 44px;
      right: 92px;
      font-size: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-variant-numeric: tabular-nums;
      z-index: 25;
    }

    /* ───── Markers ───── */
    /* marker 使用 --zoom 變數做反向縮放，這樣地圖放大時點不會跟著變大 */
    .marker {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(calc(1 / var(--zoom, 1)));
      cursor: pointer;
      border: 3px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
    }
    .marker:hover {
      transform: translate(-50%, -50%) scale(calc(1.4 / var(--zoom, 1)));
      z-index: 20;
    }
    .marker.active {
      transform: translate(-50%, -50%) scale(calc(1.4 / var(--zoom, 1)));
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5), 0 2px 6px rgba(0,0,0,0.3);
      z-index: 20;
    }

    /* 從列表頁跳過來時，目標標記閃爍引導視線 */
    @keyframes marker-pulse {
      0%, 100% {
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.6),
                    0 0 0 6px rgba(44, 85, 48, 0.5),
                    0 2px 6px rgba(0,0,0,0.3);
      }
      50% {
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.6),
                    0 0 0 16px rgba(44, 85, 48, 0),
                    0 2px 6px rgba(0,0,0,0.3);
      }
    }
    .marker.pulse {
      animation: marker-pulse 1.4s ease-out 3;
    }

    .marker.lecture     { background: var(--c-lecture); }
    .marker.workshop    { background: var(--c-workshop); }
    .marker.club        { background: var(--c-club); }
    .marker.performance { background: var(--c-performance); }
    .marker.sports      { background: var(--c-sports); }
    .marker.competition { background: var(--c-competition); }

    /* ───── Event card (popup) ───── */
    .event-card {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 320px;
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      z-index: 30;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .event-card.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .event-card .type-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      color: white;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }
    .type-tag.lecture     { background: var(--c-lecture); }
    .type-tag.workshop    { background: var(--c-workshop); }
    .type-tag.club        { background: var(--c-club); }
    .type-tag.performance { background: var(--c-performance); }
    .type-tag.sports      { background: var(--c-sports); }
    .type-tag.competition { background: var(--c-competition); }

    .event-card .close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-muted);
      line-height: 1;
      padding: 6px 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .event-card .close:hover { background: var(--bg); }

    .event-card h3 {
      font-family: 'Noto Serif TC', serif;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 14px;
      padding-right: 28px;
    }

    .event-card .meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-muted);
      padding: 12px 0;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }
    .event-card .meta-item { display: flex; gap: 10px; }
    .event-card .meta-item .label {
      font-weight: 500;
      color: var(--text);
      min-width: 36px;
      letter-spacing: 0.05em;
    }
    .event-card .description {
      font-size: 13px;
      line-height: 1.75;
      color: var(--text);
      margin-bottom: 16px;
    }
    .event-card .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .event-card .link {
      display: inline-block;
      padding: 9px 18px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      letter-spacing: 0.04em;
      transition: background 0.2s, border-color 0.2s;
    }
    .event-card .link.primary {
      background: var(--text);
      color: white;
    }
    .event-card .link.primary:hover { background: var(--accent); }
    .event-card .link.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .event-card .link.secondary:hover { background: var(--bg); }
    .event-card .reg-badge {
      display: inline-block;
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 6px;
      background: rgba(217, 115, 66, 0.12);
      color: #B85A2B;
      font-weight: 500;
    }
    .event-card .reg-badge.free {
      background: rgba(74, 124, 58, 0.12);
      color: var(--accent);
    }
    .offsite-tag {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      font-size: 10px;
      border-radius: 999px;
      background: rgba(217, 115, 66, 0.15);
      color: #B85A2B;
      vertical-align: middle;
      letter-spacing: 0.05em;
    }

    /* ───── Status indicator ───── */
    .map-meta {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      padding: 8px 14px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-variant-numeric: tabular-nums;
    }
    .map-meta strong { font-weight: 700; }

    /* ───── 校外/其他地點面板 ───── */
    .offscreen-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      max-width: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border: 1px solid var(--border-soft);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      overflow: hidden;
      z-index: 15;
    }
    .offscreen-panel.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .offscreen-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .offscreen-head .icon { font-size: 14px; }
    .offscreen-head .count-badge {
      margin-left: auto;
      background: var(--text);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .offscreen-list {
      max-height: 240px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .offscreen-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .offscreen-item:hover { background: var(--bg); }
    .offscreen-item .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .offscreen-item .info {
      min-width: 0;
      flex: 1;
    }
    .offscreen-item .title {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .offscreen-item .loc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      校園活動
      <span class="accent"></span>
      地圖
      <span class="sub">NTU CAMPUS EVENTS</span>
    </div>
    <nav>
      <a href="home.html">首頁</a>
      <a href="index.html" class="active">地圖</a>
      <a href="events.html">活動列表</a>
      <a href="calendar.html">行事曆</a>
    </nav>
  </header>

  <main>
    <aside class="sidebar">
      <h2>活動類型</h2>
      <div class="filter-list" id="typeFilters"></div>

      <h2>時間範圍</h2>
      <div class="filter-list" id="dateFilters">
        <label class="filter-item">
          <input type="radio" name="date" value="all" checked>
          <span class="label-text">全部</span>
        </label>
        <label class="filter-item">
          <input type="radio" name="date" value="week">
          <span class="label-text">未來一週</span>
        </label>
        <label class="filter-item">
          <input type="radio" name="date" value="month">
          <span class="label-text">未來一個月</span>
        </label>
      </div>

      <div class="sidebar-foot">
        點地圖上的彩色圓點查看活動詳情。<br>
        想新增活動？編輯 <code>EVENTS</code> 陣列即可。
      </div>
    </aside>

  <script>
    /* 程式邏輯（資料在 events.js） */


    /* ════════════════════════════════════════════════
       以下是程式邏輯，新手不用改也能用
       ════════════════════════════════════════════════ */

    const state = {
      activeTypes: new Set(EVENT_TYPES.map(t => t.id)),
      dateFilter: 'all',
      selectedId: null,
    };

    function renderFilters() {
      const counts = {};
      EVENTS.forEach(e => { counts[e.type] = (counts[e.type] || 0) + 1; });

      const container = document.getElementById('typeFilters');
      container.innerHTML = EVENT_TYPES.map(t => `
        <label class="filter-item">
          <input type="checkbox" data-type="${t.id}" ${state.activeTypes.has(t.id) ? 'checked' : ''}>
          <span class="dot" style="background:${t.color}"></span>
          <span class="label-text">${t.name}</span>
          <span class="count">${counts[t.id] || 0}</span>
        </label>
      `).join('');

      container.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', () => {
          const type = input.dataset.type;
          if (input.checked) state.activeTypes.add(type);
          else state.activeTypes.delete(type);
          renderMarkers();
        });
      });

      document.querySelectorAll('input[name="date"]').forEach(input => {
        input.addEventListener('change', () => {
          state.dateFilter = input.value;
          renderMarkers();
        });
      });
    }

    function isWithinDateRange(event) {
      if (state.dateFilter === 'all') return true;
      const eventDate = new Date(event.date);
      const now = new Date();
      const daysLimit = state.dateFilter === 'week' ? 7 : 30;
      const future = new Date();
      future.setDate(now.getDate() + daysLimit);
      return eventDate >= now && eventDate <= future;
    }

    function renderMarkers() {
      const container = document.getElementById('mapContainer');
      container.querySelectorAll('.marker').forEach(m => m.remove());

      let visible = 0;
      let offscreenCount = 0;
      const offscreenList = [];

      EVENTS.forEach(event => {
        const passFilter = state.activeTypes.has(event.type) && isWithinDateRange(event);
        if (!passFilter) return;

        if (!event.mapLocation) {
          // 沒有有效座標 → 校外/其他
          offscreenCount++;
          offscreenList.push(event);
          return;
        }
        visible++;

        const marker = document.createElement('div');
        marker.className = `marker ${event.type}`;
        marker.style.left = `${event.x * 100}%`;
        marker.style.top = `${event.y * 100}%`;
        marker.dataset.id = event.id;
        marker.title = event.title;
        marker.addEventListener('click', (e) => {
          e.stopPropagation();
          showEvent(event.id);
        });
        container.appendChild(marker);
      });

      document.getElementById('visibleCount').textContent = visible;
      document.getElementById('totalCount').textContent = EVENTS.length;
      renderOffscreenPanel(offscreenList);

      // 若目前選中的活動被篩掉了，把卡片關掉
      if (state.selectedId) {
        const sel = EVENTS.find(e => e.id === state.selectedId);
        if (!sel || !state.activeTypes.has(sel.type) || !isWithinDateRange(sel)) closeCard();
      }
    }

    function renderOffscreenPanel(list) {
      const panel = document.getElementById('offscreenPanel');
      const countEl = document.getElementById('offscreenCount');
      const listEl = document.getElementById('offscreenList');
      if (list.length === 0) {
        panel.classList.remove('show');
        return;
      }
      panel.classList.add('show');
      countEl.textContent = list.length;
      listEl.innerHTML = list.map(e => {
        const type = EVENT_TYPES.find(t => t.id === e.type) || {};
        return `
          <div class="offscreen-item" data-id="${e.id}">
            <span class="dot" style="background:${type.color || '#999'}"></span>
            <div class="info">
              <div class="title">${escapeHtml(e.title)}</div>
              <div class="loc">${escapeHtml(e.location || '地點未提供')}</div>
            </div>
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('.offscreen-item').forEach(el => {
        el.addEventListener('click', () => showEvent(el.dataset.id));
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showEvent(id) {
      const event = EVENTS.find(e => e.id === id);
      if (!event) return;
      state.selectedId = id;

      // 標記反白
      document.querySelectorAll('.marker').forEach(m => m.classList.toggle('active', m.dataset.id === id));

      const type = EVENT_TYPES.find(t => t.id === event.type);
      const typeTag = document.getElementById('cardType');
      typeTag.className = `type-tag ${event.type}`;
      typeTag.textContent = type ? type.name : event.type;

      document.getElementById('cardTitle').textContent = event.title;

      // 組合 meta：時間、地點、主辦單位
      const offsiteTag = event.mapLocation ? '' : ' <span class="offsite-tag">校外/其他</span>';
      const metaItems = [
        `<div class="meta-item"><span class="label">時間</span><span>${event.date} · ${event.time || ''}</span></div>`,
        `<div class="meta-item"><span class="label">地點</span><span>${event.location || '地點未提供'}${offsiteTag}</span></div>`,
      ];
      if (event.organizer) {
        metaItems.push(`<div class="meta-item"><span class="label">主辦</span><span>${event.organizer}</span></div>`);
      }
      document.getElementById('cardMeta').innerHTML = metaItems.join('');
      document.getElementById('cardDesc').textContent = event.description || '';

      // 動態組合行動按鈕：詳情連結 + 報名連結（如果有的話）
      const actionsContainer = document.getElementById('cardActions');
      const buttons = [];

      // 「需要報名」+ 有報名連結 → 大按鈕「立即報名」
      if (event.needsRegistration && event.registrationLink) {
        buttons.push(`<a href="${trackUrl(event.id, event.registrationLink)}" class="link primary" target="_blank" rel="noopener">立即報名 →</a>`);
        if (event.link) {
          buttons.push(`<a href="${trackUrl(event.id, event.link)}" class="link secondary" target="_blank" rel="noopener">詳情</a>`);
        }
      } else if (event.needsRegistration === true && !event.registrationLink) {
        // 標示需要報名但沒提供連結
        buttons.push(`<span class="reg-badge">⚠ 需報名（請洽主辦單位）</span>`);
        if (event.link) {
          buttons.push(`<a href="${trackUrl(event.id, event.link)}" class="link primary" target="_blank" rel="noopener">查看活動 →</a>`);
        }
      } else {
        // 不需報名 / 未指定
        if (event.link) {
          buttons.push(`<a href="${trackUrl(event.id, event.link)}" class="link primary" target="_blank" rel="noopener">查看活動 →</a>`);
        }
        if (event.needsRegistration === false) {
          buttons.push(`<span class="reg-badge free">自由參加</span>`);
        }
      }
      actionsContainer.innerHTML = buttons.join('');

      document.getElementById('eventCard').classList.add('active');
    }

    function closeCard() {
      document.getElementById('eventCard').classList.remove('active');
      document.querySelectorAll('.marker.active').forEach(m => m.classList.remove('active'));
      state.selectedId = null;
    }

    /* ────────────────────────────────────────
       Panzoom 縮放與拖曳
       ──────────────────────────────────────── */
    const mapContainer = document.getElementById('mapContainer');
    const mapViewport = document.getElementById('mapViewport');
    const zoomLevelLabel = document.getElementById('zoomLevel');

    const panzoom = Panzoom(mapContainer, {
      maxScale: 5,
      minScale: 0.5,
      step: 0.3,
      animate: true,
      duration: 200,
      cursor: 'grab',
    });

    // 滑鼠滾輪縮放（按住 Ctrl 或直接滾，這裡選直接滾）
    mapViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      panzoom.zoomWithWheel(e);
    }, { passive: false });

    // 按鈕
    document.getElementById('zoomIn').addEventListener('click', () => panzoom.zoomIn());
    document.getElementById('zoomOut').addEventListener('click', () => panzoom.zoomOut());
    document.getElementById('zoomReset').addEventListener('click', () => panzoom.reset());

    // 監聽 panzoom 變化，把目前 scale 寫進 CSS 變數（讓 marker 反向縮放）並更新顯示
    mapContainer.addEventListener('panzoomchange', (e) => {
      const scale = e.detail.scale;
      mapContainer.style.setProperty('--zoom', scale);
      zoomLevelLabel.textContent = Math.round(scale * 100) + '%';
    });

    /* ────────────────────────────────────────
       小工具：點地圖任意處印出該點百分比座標
       新增活動時，先點一下地圖位置取得座標
       注意：只在「沒拖曳」時觸發
       ──────────────────────────────────────── */
    let isPanning = false;
    mapContainer.addEventListener('panzoomstart', () => { isPanning = false; });
    mapContainer.addEventListener('panzoompan', () => { isPanning = true; });

    mapContainer.addEventListener('click', (e) => {
      if (isPanning) return;
      if (e.target.classList.contains('marker')) return;
      const img = document.getElementById('mapImage');
      const rect = img.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width).toFixed(3);
      const y = ((e.clientY - rect.top) / rect.height).toFixed(3);
      console.log(`📍 該點座標 → x: ${x}, y: ${y}`);
    });

    /* ────────────────────────────────────────
       從列表頁跳轉處理：讀網址後面的 #活動id
       例：events.html 點「在地圖上查看」會跳到 index.html#e3
       ──────────────────────────────────────── */
    function handleHash() {
      const id = window.location.hash.slice(1); // 去掉 #
      if (!id) return;

      const event = EVENTS.find(e => e.id === id);
      if (!event) return;

      // 1. 確保該活動的類型沒被篩掉
      if (!state.activeTypes.has(event.type)) {
        state.activeTypes.add(event.type);
        renderFilters(); // 重新渲染篩選器，反映新的勾選狀態
      }

      // 2. 確保時間範圍也包含這場活動（不然會看不到）
      if (state.dateFilter !== 'all' && !isWithinDateRange(event)) {
        state.dateFilter = 'all';
        const allRadio = document.querySelector('input[name="date"][value="all"]');
        if (allRadio) allRadio.checked = true;
      }

      // 3. 重新渲染標記（確保新加入的類型/範圍有畫出來）
      renderMarkers();

      // 4. 把地圖縮放/位置重設，讓使用者一定看得到該點
      if (typeof panzoom !== 'undefined') panzoom.reset();

      // 5. 彈出活動卡片
      showEvent(id);

      // 6. 讓對應標記閃爍 3 次
      setTimeout(() => {
        const marker = document.querySelector(`.marker[data-id="${id}"]`);
        if (marker) {
          marker.classList.add('pulse');
          // 動畫結束後移除 class，這樣下次再點才會重新觸發
          setTimeout(() => marker.classList.remove('pulse'), 4500);
        }
      }, 250);
    }

    /* ────────────────────────────────────────
       動態調整圖片大小，確保 fit viewport
       ──────────────────────────────────────── */
    function fitImage() {
      const vRect = mapViewport.getBoundingClientRect();
      const img = document.getElementById('mapImage');
      img.style.maxWidth = vRect.width + 'px';
      img.style.maxHeight = vRect.height + 'px';
    }

    const mapImageEl = document.getElementById('mapImage');
    if (mapImageEl.complete) {
      fitImage();
    } else {
      mapImageEl.addEventListener('load', fitImage);
    }
    window.addEventListener('resize', () => {
      fitImage();
      if (typeof panzoom !== 'undefined') panzoom.reset();
    });

    // 啟動：先從 Google Sheet 讀資料，再渲染畫面
    loadEvents().then(() => {
      renderFilters();
      renderMarkers();
      handleHash();                              // 第一次進頁面時檢查 hash
      // 回報訪客在地圖上看到所有活動（不限 active types，這頁進來代表整個地圖都被看到）
      if (window.reportViews) {
        window.reportViews(EVENTS.map(e => e.id));
      }
    });
    window.addEventListener('hashchange', handleHash); // 之後 hash 改變也觸發
  </script>
  <!-- Vercel Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
